<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#64d2ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="60" y="72" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">
    Jak działa rejestr metod
  </text>
  <text x="60" y="106" fill="#b9c9df" font-family="Arial, sans-serif" font-size="18">
    Jedna rejestracja — dynamiczne trasy HTTP i dokumentacja OpenAPI
  </text>

  <g filter="url(#shadow)">
    <rect x="55" y="150" width="280" height="130" rx="18" fill="url(#card)"/>
    <text x="195" y="188" text-anchor="middle" fill="#172b4d" font-family="Arial" font-size="21" font-weight="700">Implementacja metody</text>
    <text x="195" y="224" text-anchor="middle" fill="#44546a" font-family="Arial" font-size="16">LSB / JSteg / JSteg-MF / F5</text>
    <text x="195" y="250" text-anchor="middle" fill="#44546a" font-family="Arial" font-size="16">OutGuess / nsF5 ...</text>
  </g>

  <path d="M335 215 H420" stroke="#64d2ff" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="420" y="150" width="300" height="130" rx="18" fill="#ffffff"/>
    <text x="570" y="188" text-anchor="middle" fill="#172b4d" font-family="Arial" font-size="21" font-weight="700">MethodMetadata</text>
    <text x="570" y="220" text-anchor="middle" fill="#44546a" font-family="Arial" font-size="15">name, label</text>
    <text x="570" y="244" text-anchor="middle" fill="#44546a" font-family="Arial" font-size="15">input_formats, output_format</text>
    <text x="570" y="268" text-anchor="middle" fill="#44546a" font-family="Arial" font-size="15">opcje: key, ...</text>
  </g>

  <path d="M720 215 H805" stroke="#64d2ff" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="805" y="150" width="340" height="130" rx="18" fill="#dbeafe"/>
    <text x="975" y="188" text-anchor="middle" fill="#172b4d" font-family="Arial" font-size="21" font-weight="700">METHOD_REGISTRY</text>
    <text x="975" y="224" text-anchor="middle" fill="#44546a" font-family="Arial" font-size="16">register(name, method)</text>
    <text x="975" y="250" text-anchor="middle" fill="#44546a" font-family="Arial" font-size="16">names() / get() / metadata()</text>
  </g>

  <path d="M975 280 V340" fill="none" stroke="#64d2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M975 340 H600 V375" fill="none" stroke="#64d2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M975 340 H1020 V375" fill="none" stroke="#64d2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="55" y="375" width="650" height="225" rx="18" fill="#ffffff"/>
    <text x="380" y="415" text-anchor="middle" fill="#172b4d" font-family="Arial" font-size="21" font-weight="700">Dynamiczne trasy Flask</text>
    <rect x="85" y="445" width="590" height="42" rx="10" fill="#eff6ff"/>
    <text x="380" y="472" text-anchor="middle" fill="#1d4ed8" font-family="monospace" font-size="17">POST /api/v1/{method}/capacity</text>
    <rect x="85" y="497" width="590" height="42" rx="10" fill="#eff6ff"/>
    <text x="380" y="524" text-anchor="middle" fill="#1d4ed8" font-family="monospace" font-size="17">POST /api/v1/{method}/embed</text>
    <rect x="85" y="549" width="590" height="42" rx="10" fill="#eff6ff"/>
    <text x="380" y="576" text-anchor="middle" fill="#1d4ed8" font-family="monospace" font-size="17">POST /api/v1/{method}/extract</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="745" y="375" width="400" height="205" rx="18" fill="#ffffff"/>
    <text x="945" y="415" text-anchor="middle" fill="#172b4d" font-family="Arial" font-size="21" font-weight="700">Swagger / OpenAPI</text>
    <rect x="775" y="445" width="340" height="42" rx="10" fill="#ecfdf5"/>
    <text x="945" y="472" text-anchor="middle" fill="#047857" font-family="Arial" font-size="16">formaty wejścia i wyjścia</text>
    <rect x="775" y="497" width="340" height="42" rx="10" fill="#ecfdf5"/>
    <text x="945" y="524" text-anchor="middle" fill="#047857" font-family="Arial" font-size="16">opcje i kody odpowiedzi</text>
  </g>
</svg>
